device: cuda
base_precision: 32
seed: 22
architecture:
  name: pet
  model:
    cutoff: 4.5
    cutoff_width: 0.2
    d_pet: 128
    d_head: 128
    d_feedforward: 512
    num_heads: 8
    num_attention_layers: 2
    num_gnn_layers: 2
    zbl: false
    long_range:
      enable: false
      use_ewald: false
      smearing: 1.4
      kspace_resolution: 1.33
      interpolation_nodes: 5
  training:
    distributed: false
    distributed_port: 39591
    batch_size: 16
    num_epochs: 500
    num_epochs_warmup: 5
    learning_rate: 1.0e-05
    weight_decay: null
    scheduler_patience: 250
    scheduler_factor: 0.5
    log_interval: 1
    checkpoint_interval: 10
    scale_targets: false
    fixed_composition_weights: {}
    per_structure_targets: []
    log_mae: true
    log_separate_blocks: false
    best_model_metric: rmse_prod
    grad_clip_norm: .inf
    loss:
      energy:
        type: mse
        weight: 1.0
        reduction: mean
        sliding_factor: null
        gradients:
          positions:
            type: mse
            weight: 1.0
            reduction: mean
            sliding_factor: null
            gradients: {}
          strain:
            type: mse
            weight: 1.0
            reduction: mean
            sliding_factor: null
            gradients: {}
    finetune:
      method: heads
      read_from: ../../pet-mad-v1.0.2.ckpt
      config:
        head_modules:
        - node_heads
        - edge_heads
        last_layer_modules:
        - node_last_layers
        - edge_last_layers
training_set:
- systems:
    read_from: ../../train.extxyz
    reader: null
    length_unit: angstrom
  targets:
    energy:
      quantity: energy
      read_from: ../../train.extxyz
      reader: null
      key: energy
      unit: eV
      per_atom: false
      type: scalar
      num_subtargets: 1
      forces:
        read_from: ../../train.extxyz
        reader: null
        key: forces
      stress:
        read_from: ../../train.extxyz
        reader: null
        key: stress
      virial: false
validation_set:
- systems:
    read_from: ../../val.extxyz
    reader: null
    length_unit: angstrom
  targets:
    energy:
      quantity: energy
      read_from: ../../val.extxyz
      reader: null
      key: energy
      unit: eV
      per_atom: false
      type: scalar
      num_subtargets: 1
      forces:
        read_from: ../../val.extxyz
        reader: null
        key: forces
      stress:
        read_from: ../../val.extxyz
        reader: null
        key: stress
      virial: false
test_set:
- systems:
    read_from: ../../test.extxyz
    reader: null
    length_unit: angstrom
  targets:
    energy:
      quantity: energy
      read_from: ../../test.extxyz
      reader: null
      key: energy
      unit: eV
      per_atom: false
      type: scalar
      num_subtargets: 1
      forces:
        read_from: ../../test.extxyz
        reader: null
        key: forces
      stress:
        read_from: ../../test.extxyz
        reader: null
        key: stress
      virial: false
